<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GudangPintar - Riwayat</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="history-style.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <header class="header-db z-999">
      <div class="logo">Gudang Pintar</div>

      <div class="search-container">
        <form action="">
          <input
            type="text"
            placeholder="Cari..."
            id="search-bar"
            class="form-control"
          />
        </form>
      </div>

      <div class="header-right"></div>
    </header>

    <div class="d-flex min-vh-100">
      <aside
        class="sidebar-db bg-white p-3 border-end d-flex flex-column"
        style="width: 250px"
      >
        <nav class="flex-grow-1">
          <ul class="nav flex-column gap-2">
            <li class="nav-item">
              <a href="dashboard.html" class="nav-link text-black sidebar-link rounded">Dashboard</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link text-black sidebar-link rounded">Barang</a>
            </li>
            <li class="nav-item">
              <a href="transaksi.html" class="nav-link text-black sidebar-link rounded">Transaksi</a>
            </li>
            <li class="nav-item">
              <a href="history.html" class="nav-link text-black sidebar-link active-link rounded" aria-current="page">Riwayat</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link text-black sidebar-link rounded">Akun</a>
            </li>
          </ul>
        </nav>
      </aside>

      <main class="flex-grow-1 history-main">
        <div class="item container-fluid p-0">
          <div class="history-list">
            <div class="card history-card">
              <div class="card-body">
                <div class="history-head d-flex justify-content-between">
                  <span>Ubah jumlah stok</span>
                  <span class="history-date">4/6/2025</span>
                </div>
                <div class="history-detail">
                  <strong class="item-name">Air mineral</strong>
                  <span class="old-value">7</span>
                  <span class="arrow" aria-label="menjadi">→</span>
                  <span class="new-value">31</span>
                </div>
              </div>
            </div>

            <div class="card history-card">
              <div class="card-body">
                <div class="history-head d-flex justify-content-between">
                  <span>Ubah jumlah stok</span>
                  <span class="history-date">4/6/2025</span>
                </div>
                <div class="history-detail">
                  <strong class="item-name">Air mineral</strong>
                  <span class="old-value">7</span>
                  <span class="arrow" aria-label="menjadi">→</span>
                  <span class="new-value">5</span>
                </div>
              </div>
            </div>

            <div class="card history-card">
              <div class="card-body">
                <div class="history-head d-flex justify-content-between">
                  <span>Ubah harga</span>
                  <span class="history-date">4/6/2025</span>
                </div>
                <div class="history-detail">
                  <strong class="item-name">Air mineral</strong>
                  <span class="old-value">3000</span>
                  <span class="arrow" aria-label="menjadi">→</span>
                  <span class="new-value">4000</span>
                </div>
              </div>
            </div>

            <div class="card history-card">
              <div class="card-body">
                <div class="history-head d-flex justify-content-between">
                  <span>Ubah kategori</span>
                  <span class="history-date">4/6/2025</span>
                </div>
                <div class="history-detail">
                  <strong class="item-name">Air mineral</strong>
                  <span class="old-value">Makanan dan minuman</span>
                  <span class="arrow" aria-label="menjadi">→</span>
                  <span class="new-value">ATK</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
