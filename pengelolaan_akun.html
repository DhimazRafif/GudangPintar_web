<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengelolaan Akun</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Kontainer utama untuk simulasi tampilan Mobile -->
    <div class="mobile-container d-flex flex-column bg-white shadow-lg">
        
        <!-- Top App Bar (Sesuai gambar bagian atas) -->
        <div class="d-flex align-items-center justify-content-between p-3 bg-white border-bottom">
            <button class="btn btn-light rounded-circle shadow-sm" onclick="goBack()">
                <i class="bi bi-arrow-left"></i>
            </button>
            <div class="text-center">
                <h6 class="fw-bold mb-0">UI Gudang Pintar</h6>
                <small class="text-muted">Page 1 <i class="bi bi-chevron-down"></i></small>
            </div>
            <div>
                <button class="btn btn-light rounded-circle shadow-sm me-1" onclick="openChat()">
                    <i class="bi bi-chat-dots"></i>
                </button>
                <button class="btn btn-light rounded-circle shadow-sm" onclick="openMenu()">
                    <i class="bi bi-three-dots-vertical"></i>
                </button>
            </div>
        </div>

        <!-- Header Hijau -->
        <div class="header-green text-center py-4">
            <h3 class="fw-bold mb-0 text-dark">Pengelolaan Akun</h3>
        </div>

        <!-- Konten Utama (Daftar Akun) -->
        <div class="flex-grow-1 p-3 overflow-auto position-relative">
            
            <!-- Card Akun 1 (Admin) -->
            <div class="card mb-3 shadow-sm border rounded-3">
                <div class="card-body d-flex justify-content-between align-items-center p-3">
                    <div class="d-flex flex-column">
                        <h5 class="fw-bold mb-0 text-dark">Siti<br>Khadijah</h5>
                        <span class="text-dark mt-1">(Admin)</span>
                    </div>
                    <div class="d-flex flex-column gap-2">
                        <button class="btn btn-sm btn-custom-green fw-bold px-4" onclick="editAkun('Siti Khadijah')">Edit</button>
                        <button class="btn btn-sm btn-danger fw-bold px-3" onclick="hapusAkun('Siti Khadijah')">Hapus</button>
                    </div>
                </div>
            </div>

            <!-- Card Akun 2 (User) -->
            <div class="card mb-3 shadow-sm border rounded-3">
                <div class="card-body d-flex justify-content-between align-items-center p-3">
                    <div class="d-flex flex-column">
                        <h5 class="fw-bold mb-0 text-dark">Dhimaz</h5>
                        <span class="text-dark mt-1">(User)</span>
                    </div>
                    <div class="d-flex flex-column gap-2">
                        <button class="btn btn-sm btn-custom-green fw-bold px-4" onclick="editAkun('Dhimaz')">Edit</button>
                        <button class="btn btn-sm btn-danger fw-bold px-3" onclick="hapusAkun('Dhimaz')">Hapus</button>
                    </div>
                </div>
            </div>

            <!-- Floating Action Button (FAB) Tambah -->
            <button class="btn btn-custom-green rounded-circle position-absolute bottom-0 end-0 m-4 shadow d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;" onclick="tambahAkun()">
                <i class="bi bi-plus-lg fs-3 fw-bold text-dark"></i>
            </button>
        </div>

        <!-- Bottom Navigation -->
        <div class="d-flex justify-content-around align-items-center py-2 border-top bg-white">
            <div class="nav-item-custom d-flex flex-column align-items-center text-muted" onclick="navigate('Dashboard')">
                <i class="bi bi-star fs-5 mb-1"></i>
                <small style="font-size: 0.7rem;">Dashboard</small>
            </div>
            <div class="nav-item-custom d-flex flex-column align-items-center text-muted" onclick="navigate('Barang')">
                <i class="bi bi-star fs-5 mb-1"></i>
                <small style="font-size: 0.7rem;">Barang</small>
            </div>
            <div class="nav-item-custom d-flex flex-column align-items-center text-muted" onclick="navigate('Riwayat')">
                <i class="bi bi-star fs-5 mb-1"></i>
                <small style="font-size: 0.7rem;">Riwayat</small>
            </div>
            <!-- Menu Aktif (Akun) -->
            <div class="nav-item-custom d-flex flex-column align-items-center" onclick="navigate('Akun')">
                <div class="active-pill d-flex flex-column align-items-center px-3 py-1">
                    <i class="bi bi-star fs-5 mb-1 text-dark"></i>
                    <small style="font-size: 0.7rem;" class="fw-bold text-dark">Akun</small>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script Fungsionalitas Tombol -->
    <script>
        function editAkun(nama) {
            alert("Tombol Edit ditekan untuk akun: " + nama);
            // Di aplikasi nyata, ini akan membuka modal atau halaman edit
        }

        function hapusAkun(nama) {
            if(confirm("Apakah Anda yakin ingin menghapus akun " + nama + "?")) {
                alert("Akun " + nama + " berhasil dihapus!");
                // Logika untuk menghapus data
            }
        }

        function tambahAkun() {
            alert("Tombol Tambah (+) ditekan. Membuka form tambah akun...");
        }

        function navigate(halaman) {
            alert("Navigasi ke halaman: " + halaman);
        }

        function goBack() {
            alert("Kembali ke halaman sebelumnya");
        }

        function openChat() {
            alert("Membuka fitur chat");
        }

        function openMenu() {
            alert("Membuka menu opsi lainnya");
        }
    </script>
</body>
</html>
