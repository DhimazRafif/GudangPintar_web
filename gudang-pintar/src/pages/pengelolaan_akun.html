<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gudang Pintar - Pengelolaan Akun</title>

    <!-- Bootstrap 5 CSS CDN (Sama persis dengan Dashboard, Riwayat, dan Login) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Style seragam dengan halaman lain -->
    <link rel="stylesheet" href="pengelolaan_akun-style.css" />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <!-- Header seragam dengan Dashboard, Transaksi, dan Riwayat -->
    <header class="header-db">
      <div class="logo">Gudang Pintar</div>

      <div class="search-container">
        <form id="search-form" onsubmit="event.preventDefault();">
          <input
            type="search"
            placeholder="Cari akun..."
            id="search-bar"
            class="form-control"
            aria-label="Cari akun"
          />
        </form>
      </div>

      <div class="header-right"></div>
    </header>

    <!-- Layout Utama: Sidebar di kiri, Konten di kanan -->
    <div class="dashboard-layout d-flex">
      <aside class="sidebar-db bg-white p-3 border-end d-flex flex-column">
        <nav class="flex-grow-1">
          <ul class="nav flex-column gap-2">
            <li class="nav-item">
              <a
                href="dashboard.html"
                class="nav-link text-black sidebar-link rounded"
              >Dashboard</a>
            </li>

            <li class="nav-item">
              <a
                href="dashboard.html"
                class="nav-link text-black sidebar-link rounded"
              >Barang</a>
            </li>

            <li class="nav-item">
              <a
                href="transaksi.html"
                class="nav-link text-black sidebar-link rounded"
              >Transaksi</a>
            </li>

            <li class="nav-item">
              <a
                href="history.html"
                class="nav-link text-black sidebar-link rounded"
              >Riwayat</a>
            </li>

            <li class="nav-item">
              <a
                href="pengelolaan_akun.html"
                class="nav-link text-black sidebar-link active-link rounded"
                aria-current="page"
              >Akun</a>
            </li>
          </ul>
        </nav>
      </aside>

      <!-- Area Konten Utama -->
      <main class="main-content flex-grow-1">
        <div class="container-fluid p-3 p-md-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <h1 class="dashboard-title mb-1">Pengelolaan Akun</h1>
              <p class="dashboard-description mb-0">
                Kelola daftar akun pengguna dan peran (role) di sistem Gudang Pintar.
              </p>
            </div>
            <button
              class="btn btn-success fw-semibold shadow-sm px-3 py-2"
              onclick="tambahAkun()"
            >
              + Tambah Akun
            </button>
          </div>

          <!-- Daftar Akun (Menggunakan kartu Bootstrap yang responsif dan serasi) -->
          <div id="accounts-list" class="mt-3">
            <!-- Akun 1: Siti Khadijah (Admin) -->
            <div class="card account-card mb-3" data-name="Siti Khadijah" data-role="Admin">
              <div class="card-body d-flex justify-content-between align-items-center p-3">
                <div>
                  <h5 class="fw-bold mb-1 text-dark">Siti Khadijah</h5>
                  <span class="role-badge admin">Admin</span>
                </div>
                <div class="d-flex gap-2">
                  <button class="btn btn-outline-success btn-sm px-3 fw-semibold" onclick="editAkun('Siti Khadijah')">
                    Edit
                  </button>
                  <button class="btn btn-outline-danger btn-sm px-3 fw-semibold" onclick="hapusAkun('Siti Khadijah', this)">
                    Hapus
                  </button>
                </div>
              </div>
            </div>

            <!-- Akun 2: Dhimaz (User) -->
            <div class="card account-card mb-3" data-name="Dhimaz" data-role="User">
              <div class="card-body d-flex justify-content-between align-items-center p-3">
                <div>
                  <h5 class="fw-bold mb-1 text-dark">Dhimaz</h5>
                  <span class="role-badge user">User</span>
                </div>
                <div class="d-flex gap-2">
                  <button class="btn btn-outline-success btn-sm px-3 fw-semibold" onclick="editAkun('Dhimaz')">
                    Edit
                  </button>
                  <button class="btn btn-outline-danger btn-sm px-3 fw-semibold" onclick="hapusAkun('Dhimaz', this)">
                    Hapus
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Pesan ketika pencarian tidak ditemukan -->
          <p id="empty-message" class="text-secondary mt-3" hidden>
            Akun tidak ditemukan.
          </p>
        </div>
      </main>
    </div>

    <!-- Footer seragam dengan Dashboard -->
    <footer class="footer-db">
      <p class="mb-0">&copy; 2026 Gudang Pintar</p>
    </footer>

    <!-- Script Fungsionalitas Tombol & Pencarian -->
    <script>
      function editAkun(nama) {
        alert("Edit akun: " + nama);
      }

      function hapusAkun(nama, btn) {
        if (confirm("Apakah Anda yakin ingin menghapus akun " + nama + "?")) {
          const card = btn.closest(".account-card");
          if (card) {
            card.remove();
          }
          alert("Akun " + nama + " berhasil dihapus!");
        }
      }

      function tambahAkun() {
        const nama = prompt("Masukkan nama akun baru:");
        if (!nama || !nama.trim()) return;
        const role = prompt("Masukkan role (Admin/User):", "User") || "User";

        const list = document.getElementById("accounts-list");
        const card = document.createElement("div");
        card.className = "card account-card mb-3";
        card.setAttribute("data-name", nama.trim());
        card.setAttribute("data-role", role.trim());

        const isRoleAdmin = role.trim().toLowerCase() === "admin";
        const badgeClass = isRoleAdmin ? "admin" : "user";

        card.innerHTML = `
          <div class="card-body d-flex justify-content-between align-items-center p-3">
            <div>
              <h5 class="fw-bold mb-1 text-dark">${nama.trim()}</h5>
              <span class="role-badge ${badgeClass}">${role.trim()}</span>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-outline-success btn-sm px-3 fw-semibold" onclick="editAkun('${nama.trim()}')">
                Edit
              </button>
              <button class="btn btn-outline-danger btn-sm px-3 fw-semibold" onclick="hapusAkun('${nama.trim()}', this)">
                Hapus
              </button>
            </div>
          </div>
        `;
        list.appendChild(card);
      }

      // Pencarian akun berdasarkan nama atau role
      const searchBar = document.getElementById("search-bar");
      const emptyMessage = document.getElementById("empty-message");

      searchBar.addEventListener("input", () => {
        const keyword = searchBar.value.trim().toLowerCase();
        const cards = document.querySelectorAll(".account-card");
        let visibleCount = 0;

        cards.forEach((card) => {
          const name = (card.dataset.name || "").toLowerCase();
          const role = (card.dataset.role || "").toLowerCase();
          const matches = name.includes(keyword) || role.includes(keyword);

          card.hidden = !matches;
          if (matches) {
            visibleCount++;
          }
        });

        emptyMessage.hidden = visibleCount !== 0;
      });
    </script>
  </body>
</html>
